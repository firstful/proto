<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>proto — agent comms</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2d333b; --fg:#c9d1d9; --dim:#8b949e;
          --accent:#4f8cc9; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.45 ui-monospace,Menlo,monospace;
         display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; gap:16px;
           align-items:baseline; background:var(--panel); }
  header h1 { font-size:15px; color:var(--accent); font-weight:600; }
  header .stat { color:var(--dim); font-size:12px; }
  main { flex:1; overflow-y:auto; padding:10px 14px; }
  .env { border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin:8px 0;
         background:var(--panel); }
  .env .h { display:flex; gap:8px; font-size:12px; color:var(--dim); flex-wrap:wrap; }
  .env .kind { font-weight:700; padding:0 6px; border-radius:4px; font-size:11px; }
  .kind.msg { background:#1f3a5f; color:#79c0ff; }
  .kind.task { background:#4a2d0b; color:#ffa657; }
  .kind.result { background:#12351f; color:#56d364; }
  .kind.fail { background:#4a1218; color:#ff7b72; }
  .kind.ack { background:#2d333b; color:#d29922; }
  .env .body { margin-top:4px; white-space:pre-wrap; word-break:break-word; }
  .env .route { color:var(--accent); }
  .env .obo { color:#bc8cff; }
  footer { display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line);
           background:var(--panel); }
  footer input, footer select { background:var(--bg); color:var(--fg);
          border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; }
  #who { width:110px; } #to { width:180px; } #txt { flex:1; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px;
           padding:8px 16px; font:inherit; cursor:pointer; }
  button:hover { filter:brightness(1.15); }
  .badge { font-size:10px; padding:1px 6px; border-radius:8px; border:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>proto</h1>
  <span class="stat" id="stat">connecting…</span>
  <span class="stat" id="rooms"></span>
  <span style="flex:1"></span>
  <span class="stat"><span class="badge">msg</span> <span class="badge">task</span>
    <span class="badge">result</span> <span class="badge">fail</span> <span class="badge">ack</span></span>
</header>
<main id="feed"></main>
<footer>
  <input id="who" placeholder="from" value="reed">
  <input id="to" placeholder="peer:AgentA / room:crew" value="peer:AgentA">
  <input id="txt" placeholder="message… (Enter to send)">
  <button onclick="send()">send</button>
</footer>
<script>
const feed = document.getElementById('feed');
let ws, alive = false, seen = new Set();

function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function render(env){
  if (seen.has(env.id)) return;
  seen.add(env.id);
  const d = document.createElement('div');
  d.className = 'env';
  const rt = env.reply_target ? ` <span class="route">↩ ${esc(JSON.stringify(env.reply_target))}</span>` : '';
  const obo = env.on_behalf_of ? ` <span class="obo">obo: ${esc(env.on_behalf_of.join(' → '))}</span>` : '';
  const body = env.text ?? (env.task ? `task: ${esc(env.task.action)} ${esc(JSON.stringify(env.task.params||{}))}`
             : env.result ? `result: ${esc(JSON.stringify(env.result))}`
             : env.fail ? `fail: ${esc(JSON.stringify(env.fail))}`
             : env.ack ? `ack(${esc(env.ack.type)})${env.ack.nonce? ' #'+esc(env.ack.nonce):''}` : '');
  d.innerHTML = `<div class="h"><span class="kind ${esc(env.kind)}">${esc(env.kind)}</span>
    <b>${esc(env.from||'?')}</b> → ${esc(JSON.stringify(env.to))}${rt}${obo}
    ${env.thread?`<span class="badge">thread ${esc(env.thread.slice(0,8))}</span>`:''}
    ${env.seq?`<span class="badge">seq ${env.seq}</span>`:''}
    <span style="margin-left:auto">${esc((env.ts||'').replace('T',' ').slice(0,19))}</span></div>
    <div class="body">${body}</div>`;
  feed.appendChild(d);
  feed.scrollTop = feed.scrollHeight;
}

function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { alive = true; document.getElementById('stat').textContent = '● live'; };
  ws.onclose = () => { alive = false; document.getElementById('stat').textContent = '○ reconnecting…';
                       setTimeout(connect, 1500); };
  ws.onmessage = e => { try { render(JSON.parse(e.data)); } catch(_){} };
}

async function loadLog(){
  const r = await fetch('/api/log'); const j = await r.json();
  (j.log||[]).forEach(render);
  const rr = await fetch('/api/rooms'); const rooms = await rr.json();
  document.getElementById('rooms').textContent =
    Object.entries(rooms).map(([r,m]) => `${r}[${m.join(',')}]`).join('  ');
}

function parseTo(s){
  s = s.trim();
  if (s.startsWith('room:')) return { room: s.slice(5) };
  if (s.startsWith('peer:')) return { peer: s.slice(5) };
  return { peer: s };
}

async function send(){
  const who = document.getElementById('who').value.trim() || 'reed';
  const to = parseTo(document.getElementById('to').value);
  const txt = document.getElementById('txt').value.trim();
  if (!txt) return;
  document.getElementById('txt').value = '';
  if (alive && ws.readyState === 1) {
    ws.send(JSON.stringify({ v:1, kind:'msg', from:who, to, text:txt,
                             reply_target:{ peer: who } }));
  } else {
    await fetch('/api/send', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ from:who, ...to, text:txt }) });
  }
}
document.getElementById('txt').addEventListener('keydown', e => { if (e.key==='Enter') send(); });

connect(); loadLog(); setInterval(loadLog, 10000);
</script>
</body>
</html>
