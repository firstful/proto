apiVersion: v1
kind: Namespace
metadata:
  name: proto
  labels:
    sutliff.ffilt.us/managed: "true"
---
# Headless-with-endpoints pattern: Traefik routes to the systemd protod on
# the control-plane host (deployed via /opt/proto + proto.service, NOT k8s).
apiVersion: v1
kind: Service
metadata:
  name: proto
  namespace: proto
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8808
---
apiVersion: v1
kind: Endpoints
metadata:
  name: proto
  namespace: proto
subsets:
  - addresses:
      - ip: 192.168.1.2
    ports:
      - name: http
        port: 8808
        protocol: TCP
